<!DOCTYPE html>
<html>
<head>
  <title>All Users</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>All Users</h1>
  <table border="1" cellpadding="6">
    <tr><th>Name</th><th>Age</th><th>Goal</th><th>Intensity</th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.name }}</td>
      <td>{{ u.age }}</td>
      <td>{{ u.goal }}</td>
      <td>{{ u.intensity }}</td>
    </tr>
    {% endfor %}
  </table>
  <a href="/">Back</a>
</body>
</html>
